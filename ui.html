<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:400px;height:560px;overflow:hidden}
body{overflow-x:hidden}
body{font-family:'Inter',-apple-system,sans-serif;font-size:12px;color:#1a1a1a;background:#fff;display:flex;flex-direction:column}
/* Tab bar */
.tabs{display:flex;height:40px;border-bottom:1px solid #eee;flex-shrink:0}
.tab{flex:1;border:none;background:none;font-size:11px;font-weight:500;color:#aaa;cursor:pointer;position:relative;padding:0 2px}
.tab.on{color:#1a1a1a;font-weight:700}
.tab.on::after{content:'';position:absolute;bottom:0;left:8px;right:8px;height:2px;background:#18a0fb;border-radius:1px}
/* Content */
.content{display:flex;flex:1;overflow:hidden;overflow-x:hidden}
/* Left panel */
.lp{width:120px;border-right:1px solid #eee;overflow-y:auto;flex-shrink:0;padding-bottom:8px}
.lg{font-size:9px;font-weight:600;color:#ccc;padding:8px 8px 2px;letter-spacing:.3px;text-transform:uppercase}
.li{padding:5px 8px;font-size:11px;color:#555;cursor:pointer;border-left:2px solid transparent;line-height:1.3}
.li:hover{background:#f5f5f5;color:#1a1a1a}
.li.on{background:#eef7ff;color:#18a0fb;border-left-color:#18a0fb;font-weight:600}
/* Right panel */
.rp{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;min-width:0;max-width:calc(400px - 120px)}
.srch{padding:7px 8px;border-bottom:1px solid #f0f0f0;flex-shrink:0}
.srch input{width:100%;padding:5px 8px 5px 26px;border:1px solid #e8e8e8;border-radius:5px;font-size:12px;background:#f8f8f8;outline:none;color:#333}
.srch input:focus{border-color:#18a0fb;background:#fff}
.srch-wrap{position:relative}
.srch-ico{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11px;color:#aaa;pointer-events:none}
/* Section */
.sec-hd{font-size:11px;font-weight:600;color:#888;padding:8px 10px 4px;border-bottom:1px solid #f5f5f5}
/* Field item */
.fi{display:flex;align-items:center;padding:7px 10px;cursor:pointer;gap:5px;border-bottom:1px solid #f8f8f8}
.fi:hover{background:#f5fbff}
.fi:active{background:#ddf0ff}
.fi-tag{font-size:12px;font-weight:700;color:#18a0fb;flex-shrink:0}
.fi-lbl{font-size:12px;color:#333;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi-pre{font-size:11px;color:#bbb;flex-shrink:0;max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
/* Number custom */
.num-custom{padding:12px 10px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;width:100%}
.num-custom label{font-size:11px;color:#888;font-weight:500}
.num-row{display:flex;gap:6px;align-items:center}
.num-row input{flex:1;min-width:0;padding:6px 8px;border:1px solid #e0e0e0;border-radius:5px;font-size:12px;outline:none;text-align:center}
.num-row input:focus{border-color:#18a0fb}
.num-row span{font-size:11px;color:#aaa}
.num-apply{margin-top:4px;padding:8px;background:#18a0fb;color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;width:100%}
.num-apply:hover{background:#0d8de8}
.num-fmt{padding:6px 10px;font-size:11px;color:#aaa;border-bottom:1px solid #f5f5f5}
/* Custom tab */
.full{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.ct-toolbar{display:flex;gap:5px;padding:8px;border-bottom:1px solid #f0f0f0;flex-shrink:0}
.ct-btn{flex:1;padding:6px 4px;border:1px solid #e0e0e0;border-radius:5px;background:#f5f5f5;font-size:11px;font-weight:500;color:#555;cursor:pointer;text-align:center}
.ct-btn:hover{background:#eaeaea}
.ct-btn.danger{color:#e53935;border-color:#fcc}
.ct-btn.danger:hover{background:#fff0f0}
.ct-list{flex:1;overflow-y:auto}
.ct-empty{padding:20px;text-align:center;font-size:12px;color:#ccc}
.ct-item{display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid #f5f5f5;cursor:pointer;gap:6px}
.ct-item:hover{background:#f5fbff}
.ct-name{flex:1;font-size:12px;font-weight:500;color:#333}
.ct-cnt{font-size:11px;color:#bbb;flex-shrink:0}
.ct-pre{font-size:11px;color:#bbb;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;padding-right:4px}
.ct-del{width:22px;height:22px;border:none;background:none;font-size:16px;color:#ddd;cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ct-del:hover{background:#ffe5e5;color:#e53935}
/* Save row */
.save-row{display:flex;gap:6px;padding:8px;border-bottom:1px solid #f0f0f0;flex-shrink:0}
.save-row input{flex:1;padding:6px 8px;border:1px solid #e0e0e0;border-radius:5px;font-size:12px;outline:none}
.save-row input:focus{border-color:#18a0fb}
.save-row button{padding:6px 10px;background:#18a0fb;color:#fff;border:none;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
/* Textarea */
.ct-ta{width:100%;height:100px;padding:8px;border:1px solid #e8e8e8;border-radius:5px;font-size:12px;font-family:inherit;resize:none;outline:none;margin:0 8px;width:calc(100% - 16px)}
.ct-ta:focus{border-color:#18a0fb}
/* Bottom bar */
.bot{height:44px;border-top:1px solid #eee;display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0;background:#fafafa}
.bot-cnt{font-size:11px;color:#999;flex:1}
.bot-cnt span{color:#18a0fb;font-weight:600}
.mode-grp{display:flex;gap:3px}
.mode-btn{padding:4px 8px;border:1px solid #e0e0e0;border-radius:4px;background:#f0f0f0;font-size:11px;color:#666;cursor:pointer}
.mode-btn.on{background:#18a0fb;border-color:#18a0fb;color:#fff;font-weight:600}
.blank-btn{padding:4px 8px;border:1px solid #e0e0e0;border-radius:4px;background:#f0f0f0;font-size:11px;color:#666;cursor:pointer;margin-left:4px;border-style:dashed}
.blank-btn.on{background:#fff7e6;border-color:#ffa940;color:#d46b08;font-weight:600;border-style:dashed}
/* Notice */
.notice{padding:8px 10px;background:#fffbe6;border-bottom:1px solid #ffe58f;font-size:11px;color:#7d6608;line-height:1.5}
</style>
</head>

<div class="tabs">
  <button class="tab on" onclick="switchTab('text',this)">텍스트</button>
  <button class="tab" onclick="switchTab('number',this)">숫자</button>
  <button class="tab" onclick="switchTab('date',this)">날짜·시간</button>

<div class="content" id="content"></div>

<div class="bot">

    <button class="mode-btn" id="mRnd" onclick="setMode('random')">랜덤</button>
  </div>
  <button class="blank-btn" id="mBlank" onclick="toggleBlank()">공백포함</button>
</div>

<input type="file" id="csvFile" accept=".csv,.txt" style="display:none" onchange="importCSV(this)"/>

    { lbl:'소수점 숫자', fmt:'0.1 ~ 9.9', gen:()=>rf(0.1,9.9) },
    { lbl:'두 자리 숫자', fmt:'1 ~ 99', gen:()=>String(ri(1,99)) },
    { lbl:'세 자리 숫자', fmt:'100 ~ 999', gen:()=>String(ri(100,999)) },
    { lbl:'네 자리 숫자', fmt:'1,000 ~ 9,999', gen:()=>ri(1000,9999).toLocaleString() },
  ]},
  { g:'금액', key:'price', items:[
    { lbl:'금액 (원)', fmt:'1,000 ~ 99,000', gen:()=>(ri(1,99)*1000).toLocaleString()+'원' },
    { lbl:'금액 (만원)', fmt:'1만 ~ 100만', gen:()=>ri(1,100).toLocaleString()+'만원' },
    { lbl:'금액 (백만원)', fmt:'1백만 ~ 9백만', gen:()=>(ri(100,999)*10000).toLocaleString()+'원' },
    { lbl:'금액 (천만원)', fmt:'1천만 ~ 9천만', gen:()=>(ri(1000,9999)*10000).toLocaleString()+'원' },
    { lbl:'금액 (억)', fmt:'1억 ~ 99억', gen:()=>ri(1,99)+'억원' },
    { lbl:'금액 (조)', fmt:'1조 ~ 99조', gen:()=>ri(1,99)+'조원' },
    { lbl:'할인율', fmt:'5% ~ 70%', gen:()=>(ri(1,14)*5)+'%' },
  ]},
  { g:'백분율', key:'pct', items:[
    { lbl:'백분율', fmt:'1% ~ 100%', gen:()=>ri(1,100)+'%' },
    { lbl:'소수 백분율', fmt:'0.1% ~ 99.9%', gen:()=>rf(0.1,99.9)+'%' },
  ]},
  { g:'단위', key:'unit', items:[
    { lbl:'수량', fmt:'1 ~ 100개', gen:()=>ri(1,100)+'개' },
    { lbl:'거리 (km)', fmt:'0.1 ~ 99.9', gen:()=>rf(0.1,99.9)+'km' },
    { lbl:'거리 (m)', fmt:'1 ~ 999m', gen:()=>ri(1,999)+'m' },
    { lbl:'무게 (kg)', fmt:'0.1 ~ 99.9', gen:()=>rf(0.1,99.9)+'kg' },
    { lbl:'무게 (g)', fmt:'1 ~ 999g', gen:()=>ri(1,999)+'g' },
  ]},
  { g:'신체 정보', key:'body', items:[
    { lbl:'나이', fmt:'10 ~ 80세', gen:()=>ri(10,80)+'세' },
    { lbl:'키', fmt:'150 ~ 200cm', gen:()=>ri(150,200)+'cm' },
    { lbl:'몸무게', fmt:'40 ~ 100kg', gen:()=>ri(40,100)+'kg' },
    { lbl:'발사이즈', fmt:'220 ~ 290mm', gen:()=>(ri(22,29)*10)+'mm' },
  ]},
];

// ─── Date Data ────────────────────────────────────────────
function rDate(){return new Date(Date.now()-Math.random()*1e11);}
function pd(n){return String(n).padStart(2,'0');}
const DAYS_KO=['일','월','화','수','목','금','토'];
const DAYS_EN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DATE = [
  { g:'날짜', key:'date', items:[
    { lbl:'YYYY-MM-DD', fmt:'2024-09-22', gen:()=>{const d=rDate();return `${d.getFullYear()}-${pd(d.getMonth()+1)}-${pd(d.getDate())}`} },
    { lbl:'YY년 MM월 DD일', fmt:'23년 09월 22일', gen:()=>{const d=rDate();return `${String(d.getFullYear()).slice(2)}년 ${pd(d.getMonth()+1)}월 ${pd(d.getDate())}일`} },
    { lbl:'YYYY년 MM월 DD일', fmt:'2024년 12월 12일', gen:()=>{const d=rDate();return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`} },
    { lbl:'YYYY.MM.DD', fmt:'2024.12.20', gen:()=>{const d=rDate();return `${d.getFullYear()}.${pd(d.getMonth()+1)}.${pd(d.getDate())}`} },
    { lbl:'YYYY년 MM월', fmt:'2024년 9월', gen:()=>{const d=rDate();return `${d.getFullYear()}년 ${d.getMonth()+1}월`} },
    { lbl:'MM월 DD일', fmt:'9월 22일', gen:()=>{const d=rDate();return `${d.getMonth()+1}월 ${d.getDate()}일`} },
  ]},
  { g:'시간', key:'time', items:[
    { lbl:'HH:MM', fmt:'14:30', gen:()=>{const h=ri(0,23),m=ri(0,59);return `${pd(h)}:${pd(m)}`} },
    { lbl:'AM/PM HH:MM', fmt:'PM 02:30', gen:()=>{const h=ri(0,23),m=ri(0,59);return `${h<12?'AM':'PM'} ${pd(h%12||12)}:${pd(m)}`} },
    { lbl:'HH:MM:SS', fmt:'14:30:21', gen:()=>{const h=ri(0,23),m=ri(0,59),s=ri(0,59);return `${pd(h)}:${pd(m)}:${pd(s)}`} },
  ]},
  { g:'요일', key:'day', items:[
    { lbl:'요일 (한글)', fmt:'월요일', gen:()=>DAYS_KO[ri(0,6)]+'요일' },
    { lbl:'요일 (약어)', fmt:'월', gen:()=>DAYS_KO[ri(0,6)] },
    { lbl:'요일 (영문)', fmt:'Monday', gen:()=>DAYS_EN[ri(0,6)] },
  ]},
  { g:'날짜/시간 결합', key:'datetime', items:[
    { lbl:'YYYY-MM-DD HH:MM', fmt:'2024-09-22 14:30', gen:()=>{const d=rDate(),h=ri(0,23),m=ri(0,59);return `${d.getFullYear()}-${pd(d.getMonth()+1)}-${pd(d.getDate())} ${pd(h)}:${pd(m)}`} },
    { lbl:'YYYY년 MM월 DD일 HH:MM', fmt:'2024년 9월 22일 14:30', gen:()=>{const d=rDate(),h=ri(0,23),m=ri(0,59);return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${pd(h)}:${pd(m)}`} },
  ]},
];

// ─── Helpers ──────────────────────────────────────────────
function gen100(fn){return Array.from({length:100},fn);}
function applyItems(items){
  parent.postMessage({pluginMessage:{type:'apply',items,mode,includeBlank}},'*');
}
function applyEncoded(encoded){
  const items=JSON.parse(decodeURIComponent(encoded));
  applyItems(items);
}

function setMode(m){
  mode=m;
  document.getElementById('mAsc').classList.toggle('on',m==='asc');
  document.getElementById('mDesc').classList.toggle('on',m==='desc');
  document.getElementById('mRnd').classList.toggle('on',m==='random');
}
function toggleBlank(){
  includeBlank=!includeBlank;
  document.getElementById('mBlank').classList.toggle('on',includeBlank);
}

function updateBot(){
  document.getElementById('botCnt').innerHTML=`<span>${selCount}</span>개 텍스트 레이어 선택됨`;
}

// ─── Tab Switching ────────────────────────────────────────
function switchTab(t, btn){
  tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  searchQ='';
  render();
}

function render(){
  const c=document.getElementById('content');
  if(tab==='text') c.innerHTML=renderText();
  else if(tab==='number') c.innerHTML=renderNumber();
  else if(tab==='date') c.innerHTML=renderDate();
  else c.innerHTML=renderCustom();
  bindEvents();
}

// ─── Text Tab ─────────────────────────────────────────────
function renderText(){
  // Build left panel
  let lhtml='';
  TEXT.forEach(g=>{
    lhtml+=`<div class="lg">${g.g}</div>`;
    g.subs.forEach(s=>{
      lhtml+=`<div class="li${s.key===textView?' on':''}" onclick="setTextView('${s.key}')">${s.name}</div>`;
    });
  });

  // Build right panel
  let rhtml=`<div class="srch"><div class="srch-wrap"><span class="srch-ico">🔍</span><input type="text" placeholder="검색어를 입력하세요" value="${searchQ}" oninput="onSearch(this.value)" id="srchInput"/></div></div>`;

  if(searchQ){
    // Search across all
    let found=false;
    TEXT.forEach(g=>g.subs.forEach(s=>s.fields.forEach(f=>{
      if(f.lbl.includes(searchQ)||f.v.some(v=>v.includes(searchQ))){
        rhtml+=`<div class="fi" onclick='applyItems(${JSON.stringify(f.v)})'><span class="fi-tag">#</span><span class="fi-lbl">${f.lbl}</span><span class="fi-pre">${f.v.slice(0,3).join(', ')}</span></div>`;
        found=true;
      }
    })));
    if(!found) rhtml+='<div class="ct-empty">검색 결과가 없습니다.</div>';
  } else {
    // Find current sub
    let sub=null;
    TEXT.forEach(g=>g.subs.forEach(s=>{if(s.key===textView)sub=s;}));
    if(sub){
      rhtml+=`<div class="sec-hd">${sub.name}</div>`;
      sub.fields.forEach(f=>{
        rhtml+=`<div class="fi" onclick='applyItems(${JSON.stringify(f.v)})'><span class="fi-tag">#</span><span class="fi-lbl">${f.lbl}</span><span class="fi-pre">${f.v.slice(0,3).join(', ')}</span></div>`;
      });
    }
  }

  return `<div class="lp">${lhtml}</div><div class="rp">${rhtml}</div>`;
}

function setTextView(k){textView=k;searchQ='';render();}
function onSearch(v){searchQ=v;render();setTimeout(()=>{const el=document.getElementById('srchInput');if(el){el.focus();el.setSelectionRange(v.length,v.length);}},0);}

// ─── Number Tab ───────────────────────────────────────────
function renderNumber(){
  let lhtml='';
  NUM.forEach(g=>{
    const on=g.key===numView?' on':'';
    if(g.isCustom){
      lhtml+=`<div class="lg">커스텀</div><div class="li${on}" onclick="setNumView('custom')">커스텀 숫자</div>`;
    } else {
      lhtml+=`<div class="lg">${g.g}</div>`;
      g.items.forEach((item,i)=>{
        const k=g.key+'_'+i;
        lhtml+=`<div class="li${k===numView?' on':''}" onclick="setNumView('${k}')">${item.lbl}</div>`;
      });
    }
  });

  let rhtml='';
  if(numView==='custom'){
    rhtml=`<div class="sec-hd">커스텀 숫자</div>
    <div class="num-custom">
      <label>숫자 범위</label>
      <div class="num-row">
        <input type="number" id="nMin" placeholder="최솟값" value="1"/>
        <span>~</span>
        <input type="number" id="nMax" placeholder="최댓값" value="100"/>
      </div>
      <label>소수점 자리수</label>
      <div class="num-row">
        <input type="number" id="nDec" placeholder="0" value="0" min="0" max="4"/>
        <span>자리</span>
      </div>
      <button class="num-apply" onclick="applyCustomNum()">적용</button>
    </div>`;
  } else {
    let found=null;
    NUM.forEach(g=>{if(g.items)g.items.forEach((item,i)=>{if(g.key+'_'+i===numView)found=item;});});
    if(found){
      rhtml=`<div class="sec-hd">${found.lbl}</div>
      <div class="num-fmt">${found.fmt}</div>
      <div class="fi" onclick="applyItems(gen100(()=>'${found.lbl}'))">
        <span class="fi-tag">#</span>
        <span class="fi-lbl">${found.lbl}</span>
        <span class="fi-pre">${found.gen()}, ${found.gen()}, ${found.gen()}</span>
      </div>`;
      // Bind properly
      rhtml=`<div class="sec-hd">${found.lbl}</div>
      <div class="num-fmt">${found.fmt}</div>
      <div class="fi" id="numApplyItem">
        <span class="fi-tag">#</span>
        <span class="fi-lbl">${found.lbl}</span>
        <span class="fi-pre">${found.gen()}, ${found.gen()}</span>
      </div>`;
    }
  }

  return `<div class="lp">${lhtml}</div><div class="rp">${rhtml}</div>`;
}

function setNumView(k){numView=k;render();}
function applyCustomNum(){
  const mn=parseFloat(document.getElementById('nMin').value)||0;
  const mx=parseFloat(document.getElementById('nMax').value)||100;
  const dec=parseInt(document.getElementById('nDec').value)||0;
  if(mn>=mx){alert('최댓값이 최솟값보다 커야 합니다.');return;}
  const items=gen100(()=>(Math.random()*(mx-mn)+mn).toFixed(dec));
  applyItems(items);
}

// ─── Date Tab ─────────────────────────────────────────────
function renderDate(){
  let lhtml='';
  DATE.forEach(g=>{
    lhtml+=`<div class="lg">${g.g}</div>`;
    g.items.forEach((item,i)=>{
      const k=g.key+'_'+i;
      lhtml+=`<div class="li${k===dateView?' on':''}" onclick="setDateView('${k}')">${item.lbl}</div>`;
    });
  });

  let rhtml='';
  let found=null;
  DATE.forEach(g=>g.items.forEach((item,i)=>{if(g.key+'_'+i===dateView)found={g,item};}));
  if(found){
    rhtml=`<div class="sec-hd">${found.g.g}</div>
    <div class="num-fmt">${found.item.fmt}</div>
    <div class="fi" id="dateApplyItem">
      <span class="fi-tag">#</span>
      <span class="fi-lbl">${found.item.lbl}</span>
      <span class="fi-pre">${found.item.gen()}</span>
    </div>`;
  }

  return `<div class="lp">${lhtml}</div><div class="rp">${rhtml}</div>`;
}

function setDateView(k){dateView=k;render();}

// ─── Custom Tab ───────────────────────────────────────────
function renderCustom(){
  let items='';
  const filtered=customLists.filter(l=>l.name.includes(searchQ)||l.items.some(v=>v.includes(searchQ)));
  if(filtered.length===0){
    items='<div class="ct-empty">저장된 목록이 없습니다.<br/>아래에서 텍스트를 입력하고 저장하세요.</div>';
  } else {
    filtered.forEach((l,i)=>{
      const realIdx=customLists.indexOf(l);
      const encoded=encodeURIComponent(JSON.stringify(l.items));
      const preview=l.items[0]+(l.items.length>1?' 외 '+(l.items.length-1)+'개':'');
      items+=`<div class="ct-item" onclick="applyEncoded('${encoded}')">
        <div class="ct-name">${l.name}</div>
        <div class="ct-pre">${preview}</div>
        <button class="ct-del" onclick="event.stopPropagation();delList(${realIdx})">×</button>
      </div>`;
    });
  }

  return `<div class="full">
    <div class="ct-toolbar">
      <button class="ct-btn" onclick="document.getElementById('csvFile').click()">📥 CSV 불러오기</button>
      <button class="ct-btn" onclick="exportAll()">📤 내보내기</button>
      <button class="ct-btn danger" onclick="clearAll()">🗑 전체 삭제</button>
    </div>
    <div class="srch" style="border-bottom:1px solid #f0f0f0">
      <div class="srch-wrap"><span class="srch-ico">🔍</span><input type="text" placeholder="목록 검색..." value="${searchQ}" oninput="onSearch(this.value)"/></div>
    </div>
    <div class="ct-list">${items}</div>
    <div style="border-top:1px solid #eee;padding:8px;flex-shrink:0">
      <textarea class="ct-ta" id="ctTa" placeholder="홍길동&#10;이영희&#10;김철수&#10;(엔터로 구분)"></textarea>
      <div class="save-row" style="margin-top:6px;padding:0">
        <input type="text" id="ctName" placeholder="목록 이름"/>
        <button onclick="saveCustom()">저장</button>
      </div>
    </div>
  </div>`;
}

function saveCustom(){
  const name=(document.getElementById('ctName').value||'').trim();
  const raw=(document.getElementById('ctTa').value||'');
  const items=raw.split('\n').map(s=>s.trim()).filter(s=>s);
  if(!name){alert('목록 이름을 입력하세요.');return;}
  if(!items.length){alert('텍스트를 입력하세요.');return;}
  const idx=customLists.findIndex(l=>l.name===name);
  if(idx>=0) customLists[idx]={name,items};
  else customLists.push({name,items});
  persist();render();
}

function delList(i){
  if(!confirm('삭제하시겠습니까?'))return;
  customLists.splice(i,1);persist();render();
}

function clearAll(){
  if(!confirm('전체 삭제하시겠습니까?'))return;
  customLists=[];persist();render();
}

function exportAll(){
  const txt=customLists.map(l=>`# ${l.name}\n${l.items.join('\n')}`).join('\n\n');
  const a=document.createElement('a');
  a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(txt);
  a.download='custom_data.txt';a.click();
}

function importCSV(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const lines=e.target.result.split('\n').map(s=>s.split(',')[0].trim()).filter(s=>s&&s!=='\r');
    const name=file.name.replace(/\.[^.]+$/,'').slice(0,20)||'가져온 목록';
    const idx=customLists.findIndex(l=>l.name===name);
    if(idx>=0) customLists[idx]={name,items:lines};
    else customLists.push({name,items:lines});
    persist();render();
    alert(`"${name}" 목록으로 ${lines.length}개 항목을 가져왔습니다.`);
  };
  reader.readAsText(file,'UTF-8');
  input.value='';
}

function persist(){
  parent.postMessage({pluginMessage:{type:'save-lists',lists:customLists}},'*');
}

// ─── Bind events after render ─────────────────────────────
function bindEvents(){
  // Number tab: bind apply item
  const numItem=document.getElementById('numApplyItem');
  if(numItem){
    let found=null;
    NUM.forEach(g=>{if(g.items)g.items.forEach((item,i)=>{if(g.key+'_'+i===numView)found=item;});});
    if(found) numItem.onclick=()=>applyItems(gen100(found.gen));
  }
  // Date tab: bind apply item
  const dateItem=document.getElementById('dateApplyItem');
  if(dateItem){
    let found=null;
    DATE.forEach(g=>g.items.forEach((item,i)=>{if(g.key+'_'+i===dateView)found=item;}));
    if(found) dateItem.onclick=()=>applyItems(gen100(found.gen));
  }
}

// ─── Remote Data Load ─────────────────────────────────────
const REMOTE_URL='https://raw.githubusercontent.com/ymjfg1004/FillYu/main/data/plugin-data.json';

async function loadRemoteData(){
  try{
    const res=await fetch(REMOTE_URL+'?t='+Date.now());
    if(!res.ok)return;
    const d=await res.json();
    if(d.text&&d.text.length) TEXT.splice(0,TEXT.length,...d.text);
    if(d.number&&d.number.length){
      // Rebuild NUM with gen functions from config
      NUM.length=0;
      NUM.push({g:'커스텀 숫자',key:'custom',isCustom:true});
      d.number.forEach(g=>{
        NUM.push({g:g.g,key:g.key,items:g.items.map(item=>({
          lbl:item.lbl,fmt:item.fmt,
          gen:()=>{
            const n=Math.random()*(item.max-item.min)+item.min;
            const step=item.step||1;
            const snapped=Math.round(n/step)*step;
            let s=snapped.toFixed(item.dec||0);
            if(item.thousands)s=parseFloat(s).toLocaleString('ko-KR');
            return s+(item.suffix||'');
          }
        }))});
      });
    }
    if(d.date&&d.date.length){
      DATE.length=0;
      const DAYS_KO=['일','월','화','수','목','금','토'];
      const DAYS_EN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      d.date.forEach(g=>{
        DATE.push({g:g.g,key:g.key,items:g.items.map(item=>({
          lbl:item.lbl,fmt:item.fmt,
          gen:()=>{
            const dt=new Date(Date.now()-Math.random()*1e11);
            const p=(n)=>String(n).padStart(2,'0');
            const h=Math.floor(Math.random()*24),m=Math.floor(Math.random()*60),s=Math.floor(Math.random()*60);
            const pat=item.pattern;
            if(pat==='DAY_KO')return DAYS_KO[dt.getDay()]+'요일';
            if(pat==='DAY_SHORT')return DAYS_KO[dt.getDay()];
            if(pat==='DAY_EN')return DAYS_EN[dt.getDay()];
            return pat
              .replace('YYYY',dt.getFullYear())
              .replace('YY',String(dt.getFullYear()).slice(2))
              .replace('MM',p(dt.getMonth()+1)).replace('M',dt.getMonth()+1)
              .replace('DD',p(dt.getDate())).replace('D',dt.getDate())
              .replace('HH',p(h)).replace('hh',p(h%12||12))
              .replace('mm',p(m)).replace('SS',p(s))
              .replace('AP',h<12?'AM':'PM');
          }
        }))});
      });
    }
    if(tab==='text'||tab==='number'||tab==='date') render();
  }catch(e){/* 오프라인이면 빌트인 데이터 사용 */}
}

// ─── Init ─────────────────────────────────────────────────
window.onmessage=e=>{
  const msg=e.data.pluginMessage;if(!msg)return;
  if(msg.type==='lists-data'){customLists=msg.lists||[];if(tab==='custom')render();}
  if(msg.type==='selection-change'){selCount=msg.count;updateBot();}
};

parent.postMessage({pluginMessage:{type:'load-lists'}},'*');
parent.postMessage({pluginMessage:{type:'get-selection'}},'*');
loadRemoteData();
parent.postMessage({pluginMessage:{type:'get-selection'}},'*');

// Initial render
render();
</script>
